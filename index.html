<!-- =========================================================
     HEGEVA AI V35.2.1
     SAFE PRICING STATUS POLISH
     UI ONLY — NO PAYMENT / ENTITLEMENT CHANGES
     ========================================================= -->

<style>
#hegevaV3521SafeStatus{
  margin:14px 0 18px;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid rgba(53,213,138,.30);
  background:rgba(53,213,138,.07);
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

#hegevaV3521SafeStatus strong{
  color:#79eab1;
}

#hegevaV3521SafeStatus.waiting{
  border-color:rgba(246,196,83,.30);
  background:rgba(246,196,83,.06);
}

#hegevaV3521SafeStatus.waiting strong{
  color:#ffe19a;
}
</style>

<script>
(() => {
  "use strict";

  function currentLanguage(){
    const value =
      document.getElementById("languageSelect")?.value || "en";

    return ["en","hu","de","fr","es"].includes(value)
      ? value
      : "en";
  }

  const TEXT = {
    en:{
      readyTitle:"Stripe Sandbox connected",
      readyText:"Test payments and the verified webhook are active. No real card charge is enabled.",
      waitingTitle:"Stripe Sandbox status",
      waitingText:"Payment testing is not fully verified yet. No real card charge is enabled.",
      basic:"Basic",
      premium:"Premium",
      pro:"Pro",
      backend:"Backend confirmed plan"
    },

    hu:{
      readyTitle:"Stripe Sandbox csatlakoztatva",
      readyText:"A tesztfizetés és az ellenőrzött webhook működik. Valódi kártyaterhelés nincs engedélyezve.",
      waitingTitle:"Stripe Sandbox állapot",
      waitingText:"A fizetési teszt még nincs teljesen ellenőrizve. Valódi kártyaterhelés nincs engedélyezve.",
      basic:"Basic",
      premium:"Premium",
      pro:"Pro",
      backend:"Backend által igazolt csomag"
    },

    de:{
      readyTitle:"Stripe Sandbox verbunden",
      readyText:"Testzahlungen und der verifizierte Webhook sind aktiv. Es werden keine echten Karten belastet.",
      waitingTitle:"Stripe Sandbox Status",
      waitingText:"Der Zahlungstest ist noch nicht vollständig verifiziert. Es werden keine echten Karten belastet.",
      basic:"Basic",
      premium:"Premium",
      pro:"Pro",
      backend:"Vom Backend bestätigter Tarif"
    },

    fr:{
      readyTitle:"Stripe Sandbox connecté",
      readyText:"Les paiements de test et le webhook vérifié sont actifs. Aucun débit réel n'est activé.",
      waitingTitle:"État Stripe Sandbox",
      waitingText:"Le test de paiement n'est pas encore entièrement vérifié. Aucun débit réel n'est activé.",
      basic:"Basic",
      premium:"Premium",
      pro:"Pro",
      backend:"Forfait confirmé par le backend"
    },

    es:{
      readyTitle:"Stripe Sandbox conectado",
      readyText:"Los pagos de prueba y el webhook verificado están activos. No se realizan cargos reales.",
      waitingTitle:"Estado Stripe Sandbox",
      waitingText:"La prueba de pago aún no está totalmente verificada. No se realizan cargos reales.",
      basic:"Basic",
      premium:"Premium",
      pro:"Pro",
      backend:"Plan confirmado por el backend"
    }
  };

  function state(){
    return window.hegevaV351StripeSubscription?.state || {};
  }

  function normalizePlan(value){
    const plan =
      String(value || "basic").toLowerCase();

    return ["basic","premium","pro"].includes(plan)
      ? plan
      : "basic";
  }

  function ensureStatus(){
    const pricing =
      document.getElementById("pricing");

    if(!pricing) return null;

    let box =
      document.getElementById("hegevaV3521SafeStatus");

    if(box) return box;

    box =
      document.createElement("div");

    box.id =
      "hegevaV3521SafeStatus";

    const heading =
      pricing.querySelector(".page-heading");

    if(heading){
      heading.insertAdjacentElement(
        "afterend",
        box
      );
    }else{
      pricing.prepend(box);
    }

    return box;
  }

  function render(){
    const box = ensureStatus();

    if(!box) return;

    const lang =
      currentLanguage();

    const text =
      TEXT[lang];

    const s =
      state();

    const ready =
      s.providerConnected === true &&
      String(s.mode || "").toLowerCase() === "test" &&
      s.checkoutEnabled === true &&
      s.webhookVerified === true;

    const plan =
      normalizePlan(s.currentPlan);

    const planName =
      plan === "premium"
        ? text.premium
        : plan === "pro"
          ? text.pro
          : text.basic;

    box.className =
      ready ? "" : "waiting";

    box.innerHTML =
      ready
        ? `<strong>✅ ${text.readyTitle}</strong><br>
           ${text.readyText}<br>
           <strong>${text.backend}: ${planName}</strong>`
        : `<strong>🧪 ${text.waitingTitle}</strong><br>
           ${text.waitingText}<br>
           <strong>${text.backend}: ${planName}</strong>`;
  }

  document
    .getElementById("languageSelect")
    ?.addEventListener(
      "change",
      () => setTimeout(render,150)
    );

  document.addEventListener(
    "click",
    event => {
      if(
        event.target.closest(
          '[data-page="pricing"]'
        )
      ){
        setTimeout(render,150);
      }
    }
  );

  setTimeout(render,400);
  setTimeout(render,1200);

  window.hegevaV3521SafePricingPolish = {
    version:"V35.2.1",
    render,
    changesEntitlement:false,
    changesCheckout:false,
    changesWebhook:false,
    handlesCardData:false
  };
})();
</script>
