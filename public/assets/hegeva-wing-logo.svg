<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
  <title id="title">HEGEVA AI winged crown logo</title>
  <desc id="desc">Gold crowned H emblem with stylized wings and HEGEVA AI wordmark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset=".28" stop-color="#ffd65a"/>
      <stop offset=".58" stop-color="#f0a90e"/>
      <stop offset="1" stop-color="#8a5700"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfff4a"/>
      <stop offset="1" stop-color="#70ef00"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(8 8)" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M70 55C48 44 29 29 15 11c7 29 22 48 47 59-18-2-35-8-51-18 12 27 31 43 57 49"/>
    <path d="M142 55c22-11 41-26 55-44-7 29-22 48-47 59 18-2 35-8 51-18-12 27-31 43-57 49"/>
  </g>
  <g transform="translate(50 16)">
    <circle cx="64" cy="62" r="48" fill="#061008" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="64" cy="62" r="38" fill="none" stroke="#98ff00" stroke-opacity=".35" stroke-width="2"/>
    <path d="M37 20l8-13 12 11 9-17 11 17 12-11 8 13" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <text x="64" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="63" font-weight="900" fill="url(#gold)">H</text>
  </g>
  <g transform="translate(218 42)">
    <text x="0" y="36" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900" letter-spacing="1" fill="#f5f7f3">HEGEVA</text>
    <text x="174" y="36" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900" fill="url(#lime)">AI</text>
    <text x="2" y="61" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#c8d1ca">BUSINESS • AI • FREEDOM</text>
  </g>
