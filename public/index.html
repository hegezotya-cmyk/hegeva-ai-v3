<!-- =========================================================
     HEGEVA AI V35.3.3
     FINAL SAFE FIX + STRIPE SANDBOX PRICING BUTTONS
     COPY THIS WHOLE BLOCK IN ONE GO
     ========================================================= -->

<style>
.v3533-checkout-button{
  width:100%;
  margin-top:12px;
}

.v3533-checkout-button.ready{
  opacity:1 !important;
  cursor:pointer !important;
}

.v3533-checkout-button.current{
  cursor:default !important;
  opacity:.65 !important;
}

.v3533-mini-note{
  margin-top:9px;
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
}

.v3533-mini-note.ok{
  color:#79eab1;
}

.v3533-mini-note.warn{
  color:#ffe19a;
}
</style>

<script>
(() => {
  "use strict";

  const TEXT = {
    en:{
      premium:"Choose Premium — Sandbox",
      pro:"Choose Pro — Sandbox",
      current:"Current backend plan",
      activePaid:"A paid plan is already active. Do not create a second subscription.",
      sandbox:"Opens Stripe Sandbox Checkout. No real money is charged.",
      waiting:"Stripe Sandbox checkout is not ready yet.",
      opening:"Opening Stripe Sandbox…"
    },

    hu:{
      premium:"Premium választása — Sandbox",
      pro:"Pro választása — Sandbox",
      current:"Jelenlegi backend csomag",
      activePaid:"Már van aktív fizetős csomag. Ne hozz létre második előfizetést.",
      sandbox:"Stripe Sandbox Checkout nyílik meg. Valódi pénzterhelés nincs.",
      waiting:"A Stripe Sandbox checkout még nem áll készen.",
      opening:"Stripe Sandbox megnyitása…"
    },

    de:{
      premium:"Premium wählen — Sandbox",
      pro:"Pro wählen — Sandbox",
      current:"Aktueller Backend-Tarif",
      activePaid:"Ein kostenpflichtiger Tarif ist bereits aktiv. Kein zweites Abonnement erstellen.",
      sandbox:"Öffnet Stripe Sandbox Checkout. Es wird kein echtes Geld belastet.",
      waiting:"Stripe Sandbox Checkout ist noch nicht bereit.",
      opening:"Stripe Sandbox wird geöffnet…"
    },

    fr:{
      premium:"Choisir Premium — Sandbox",
      pro:"Choisir Pro — Sandbox",
      current:"Forfait backend actuel",
      activePaid:"Un forfait payant est déjà actif. Ne créez pas un deuxième abonnement.",
      sandbox:"Ouvre Stripe Sandbox Checkout. Aucun débit réel.",
      waiting:"Stripe Sandbox Checkout n'est pas encore prêt.",
      opening:"Ouverture de Stripe Sandbox…"
    },

    es:{
      premium:"Elegir Premium — Sandbox",
      pro:"Elegir Pro — Sandbox",
      current:"Plan backend actual",
      activePaid:"Ya hay un plan de pago activo. No crees una segunda suscripción.",
      sandbox:"Abre Stripe Sandbox Checkout. No se cobra dinero real.",
      waiting:"Stripe Sandbox Checkout aún no está listo.",
      opening:"Abriendo Stripe Sandbox…"
    }
  };

  function language(){
    const value =
      document.getElementById("languageSelect")?.value || "en";

    return TEXT[value] ? value : "en";
  }

  function t(){
    return TEXT[language()];
  }

  function api(){
    return window.hegevaV351StripeSubscription || null;
  }

  function state(){
    return api()?.state || {};
  }

  function normalizePlan(value){
    const plan =
      String(value || "basic").toLowerCase();

    return ["basic","premium","pro"].includes(plan)
      ? plan
      : "basic";
  }

  function sandboxReady(){
    const s = state();

    return (
      s.providerConnected === true &&
      String(s.mode || "").toLowerCase() === "test" &&
      s.checkoutEnabled === true &&
      s.webhookVerified === true
    );
  }

  function setSelectedPlan(plan){
    const selected = normalizePlan(plan);

    if(window.hegevaV342PaymentTest?.state){
      window.hegevaV342PaymentTest.state.selected = selected;
    }

    document
      .querySelectorAll("[data-v342-plan]")
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.v342Plan === selected
        );
      });

    return selected;
  }

  function getCard(plan){
    return document.getElementById(
      plan === "premium"
        ? "planCardPremium"
        : "planCardPro"
    );
  }

  function ensureNote(card){
    if(!card) return null;

    let note =
      card.querySelector(".v3533-mini-note");

    if(!note){
      note =
        document.createElement("div");

      note.className =
        "v3533-mini-note";

      card.appendChild(note);
    }

    return note;
  }

  function setupCard(plan){
    const copy = t();
    const card = getCard(plan);

    if(!card) return;

    const button =
      card.querySelector("button");

    if(!button) return;

    const note =
      ensureNote(card);

    const current =
      normalizePlan(state().currentPlan);

    button.dataset.v3533Plan = plan;

    button.classList.add(
      "v3533-checkout-button"
    );

    if(current !== "basic"){
      button.disabled = true;

      button.classList.remove("ready");
      button.classList.add("current");

      button.textContent =
        current === plan
          ? copy.current
          : (
              plan === "premium"
                ? copy.premium
                : copy.pro
            );

      if(note){
        note.textContent =
          copy.activePaid;

        note.className =
          "v3533-mini-note warn";
      }

      return;
    }

    button.classList.remove("current");

    if(sandboxReady()){
      button.disabled = false;

      button.classList.add("ready");

      button.textContent =
        plan === "premium"
          ? copy.premium
          : copy.pro;

      if(note){
        note.textContent =
          copy.sandbox;

        note.className =
          "v3533-mini-note ok";
      }
    }else{
      button.disabled = true;

      button.classList.remove("ready");

      button.textContent =
        plan === "premium"
          ? copy.premium
          : copy.pro;

      if(note){
        note.textContent =
          copy.waiting;

        note.className =
          "v3533-mini-note warn";
      }
    }
  }

  function render(){
    setupCard("premium");
    setupCard("pro");

    if(
      window.hegevaV3531MountFix &&
      typeof window.hegevaV3531MountFix.repair === "function"
    ){
      try{
        window.hegevaV3531MountFix.repair();
      }catch(error){
        console.warn(
          "HEGEVA V35.3.3 panel repair:",
          error
        );
      }
    }

    if(
      window.hegevaV3532PaymentStatus &&
      typeof window.hegevaV3532PaymentStatus.render === "function"
    ){
      try{
        window.hegevaV3532PaymentStatus.render();
      }catch(error){
        console.warn(
          "HEGEVA V35.3.3 payment status:",
          error
        );
      }
    }
  }

  async function checkout(plan, button){
    const copy = t();

    if(!sandboxReady()){
      render();
      return;
    }

    const subscriptionApi =
      api();

    if(
      !subscriptionApi ||
      typeof subscriptionApi.openCheckout !== "function"
    ){
      console.warn(
        "HEGEVA V35.3.3 checkout API unavailable"
      );

      return;
    }

    if(
      normalizePlan(state().currentPlan) !== "basic"
    ){
      render();
      return;
    }

    setSelectedPlan(plan);

    const oldText =
      button?.textContent || "";

    if(button){
      button.disabled = true;
      button.textContent =
        copy.opening;
    }

    try{
      await subscriptionApi.openCheckout();
    }catch(error){
      console.warn(
        "HEGEVA V35.3.3 checkout:",
        error
      );
    }finally{
      if(button){
        button.textContent =
          oldText;
      }

      setTimeout(render,250);
      setTimeout(render,800);
    }
  }

  document.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          "[data-v3533-plan]"
        );

      if(!button) return;

      event.preventDefault();
      event.stopPropagation();

      checkout(
        normalizePlan(
          button.dataset.v3533Plan
        ),
        button
      );
    },
    true
  );

  document
    .getElementById("languageSelect")
    ?.addEventListener(
      "change",
      () => {
        setTimeout(render,150);
      }
    );

  const pricing =
    document.getElementById("pricing");

  if(pricing){
    const observer =
      new MutationObserver(() => {
        clearTimeout(
          window.__v3533RenderTimer
        );

        window.__v3533RenderTimer =
          setTimeout(render,120);
      });

    observer.observe(
      pricing,
      {
        childList:true,
        subtree:true,
        characterData:true
      }
    );
  }

  setTimeout(render,300);

  setTimeout(async () => {
    try{
      if(
        typeof api()?.checkStatus ===
        "function"
      ){
        await api().checkStatus();
      }
    }catch(error){
      console.warn(
        "HEGEVA V35.3.3 status refresh:",
        error
      );
    }

    render();
  },700);

  window.hegevaV3533PricingCheckout = {
    version:"V35.3.3",
    render,
    checkout,
    sandboxReady,
    entitlementSource:"backend",
    changesEntitlement:false,
    handlesCardData:false,
    livePaymentsEnabled:false
  };
})();
</script>

</body>
</html>
