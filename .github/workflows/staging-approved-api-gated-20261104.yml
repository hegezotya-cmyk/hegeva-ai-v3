name: HEGEVA Approved Staging API Gated Once 2026-11-04

on:
  push:
    branches: [audit/dependency-advisories-20261104]
    paths: [".github/workflows/staging-approved-api-gated-20261104.yml"]

permissions:
  contents: read
  actions: write

concurrency:
  group: hegeva-approved-staging-api-gated-20261104
  cancel-in-progress: false

jobs:
  verify-token-and-dispatch:
    if: ${{ github.repository == 'hegezotya-cmyk/hegeva-ai-v3' && github.ref == 'refs/heads/audit/dependency-advisories-20261104' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require GET access to both existing staging Workers
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id = process.env.CLOUDFLARE_ACCOUNT_ID || ""
          const token = process.env.CLOUDFLARE_API_TOKEN || ""
          if (!id || !token) { console.error("Staging credentials missing"); process.exit(1) }
          const services = ["hegeva-ai-v3-staging","hegeva-ai-v3-v0-staging"]
          let ok = true
          for (const service of services) {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(id) + "/workers/services/" + service,
              { method: "GET", headers: { Authorization: "Bearer " + token } })
            console.log(JSON.stringify({ stagingWorker: service, method: "GET", httpStatus: response.status }))
            if (response.status !== 200) ok = false
          }
          if (!ok) { console.error("Denied staging Worker access; no deployment dispatch."); process.exit(1) }
          console.log("Both scoped staging Workers accessible; no Cloudflare writes performed.")
          NODE
      - name: Dispatch existing protected API deploy no migrations
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/hegezotya-cmyk/hegeva-ai-v3/actions/workflows/staging-deploy.yml/dispatches"             -d '{"ref":"audit/dependency-advisories-20261104","inputs":{"stage":"deploy-api-no-migrate"}}'
          echo "Requested only existing staging deploy-api-no-migrate workflow."
