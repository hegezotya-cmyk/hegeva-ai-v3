name: HEGEVA Onboarding WOW V1 Check

on:
  push:
    branches:
      - growth-onboarding-wow-v1-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce narrow onboarding scope
        shell: bash
        run: |
          BASE=49f78874b29aba41ed1e99f2e029c042ab2c1c0c
          allowed='^(.github/workflows/hegeva-onboarding-wow-v1-check.yml|v0-app/app/get-started/page.tsx|v0-app/components/acquisition/acquisition-attribution.tsx|v0-app/components/analytics-consent.tsx|v0-app/components/auth/email-verification-panel.tsx|v0-app/components/business/message-studio.tsx|v0-app/components/get-started/first-wow.tsx|v0-app/lib/first-wow.ts|v0-app/scripts/onboarding-first-wow-audit.mjs)$'
          bad=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - name: Verify protected Growth Engine and Core files unchanged
        shell: bash
        run: |
          git diff --exit-code 49f78874b29aba41ed1e99f2e029c042ab2c1c0c --             v0-app/components/hegeva-logo.tsx             v0-app/app/globals.css             v0-app/components/desktop-command-rail.tsx             v0-app/components/site-header.tsx             v0-app/components/app-shell.tsx             v0-app/components/command-center/core-decision-surface.tsx             v0-app/lib/hegeva-core.ts             v0-app/components/growth/sixty-second-challenge.tsx             v0-app/lib/business-score.ts             v0-app/app/challenge/page.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        working-directory: v0-app
        run: npm ci

      - name: Onboarding first-WOW audit
        working-directory: v0-app
        run: node scripts/onboarding-first-wow-audit.mjs

      - name: Product audit
        working-directory: v0-app
        run: npm run audit:product

      - name: Mobile audit
        working-directory: v0-app
        run: npm run audit:ui-mobile

      - name: Visual audit
        working-directory: v0-app
        run: npm run audit:visual

      - name: TypeScript check
        working-directory: v0-app
        run: npx tsc --noEmit

      - name: Production build
        working-directory: v0-app
        run: npm run build
