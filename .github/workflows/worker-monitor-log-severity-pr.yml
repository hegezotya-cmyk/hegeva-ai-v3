name: Worker Monitor Log Severity PR Check

on:
  push:
    branches:
      - codex/monitor-log-severity-20261106
  pull_request:
    branches:
      - integration/security-growth-validation-20261104
    paths:
      - "src/index.js"
      - "scripts/monitor-log-severity-test.mjs"
      - ".github/workflows/worker-monitor-log-severity-pr.yml"

permissions:
  contents: read

jobs:
  monitor-severity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Monitor severity regression
        run: node scripts/monitor-log-severity-test.mjs
      - name: Existing worker checks
        run: npm run worker:check
