name: Core Incident Offline Checks

on:
  push:
    branches:
      - codex/core-production-incident-recovery-20261114

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run offline Worker and Core checks
        run: npm run worker:check
