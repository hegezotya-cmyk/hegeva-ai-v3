name: HEGEVA Cloudflare Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Release stage to run"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - remote-state
          - migrate
          - deploy-api
          - deploy-ui
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: hegeva-cloudflare-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Install V0 dependencies
        working-directory: v0-app
        run: npm ci

      - name: Release preflight
        run: npm run release:check

  cloudflare:
    needs: preflight
    if: ${{ inputs.stage != 'check' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Install V0 dependencies
        working-directory: v0-app
        run: npm ci

      - name: Require Cloudflare credentials
        if: ${{ inputs.stage != 'smoke' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Require Sentry credentials for API deployment
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          test -n "$SENTRY_AUTH_TOKEN" || { echo "Missing SENTRY_AUTH_TOKEN production environment secret"; exit 1; }

      - name: Build API Worker bundle for Sentry
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
        run: |
          npm run deploy:api -- --dry-run --outdir .sentry-worker-build
          test -s .sentry-worker-build/index-ledger.js
          test -s .sentry-worker-build/index-ledger.js.map

      - name: Inject Sentry debug IDs
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hegeva-ai
          SENTRY_PROJECT: node-cloudflare-workers
        run: ./node_modules/.bin/sentry-cli sourcemaps inject .sentry-worker-build

      - name: Upload API Worker source maps to Sentry
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hegeva-ai
          SENTRY_PROJECT: node-cloudflare-workers
        run: ./node_modules/.bin/sentry-cli sourcemaps upload --validate --wait .sentry-worker-build

      - name: Show remote D1 migration state
        if: ${{ inputs.stage == 'remote-state' || inputs.stage == 'migrate' || inputs.stage == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release:remote-state

      - name: Apply remote D1 migrations
        if: ${{ inputs.stage == 'migrate' || inputs.stage == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Deploy API Worker
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy .sentry-worker-build/index-ledger.js --no-bundle --upload-source-maps

      - name: Deploy V0 UI Worker
        if: ${{ inputs.stage == 'deploy-ui' || inputs.stage == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:ui

      - name: Run live smoke test
        if: ${{ inputs.stage == 'smoke' || inputs.stage == 'full' || inputs.stage == 'deploy-api' || inputs.stage == 'deploy-ui' }}
        run: npm run release:smoke
