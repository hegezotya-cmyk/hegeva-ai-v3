name: HEGEVA V0 Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - v0-rebuild
    paths:
      - "v0-app/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v0-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
