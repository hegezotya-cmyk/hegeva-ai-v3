name: HEGEVA V0 Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - v0-rebuild
    paths:
      - "v0-app/**"
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Worker syntax check
        run: node --check src/index.js && node --check src/auth.js

      - name: Worker deploy dry run
        run: npm run deploy:dry-run

      - name: Install V0 dependencies
        working-directory: v0-app
        run: npm ci

      - name: TypeScript check
        working-directory: v0-app
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: v0-app
        run: npm run build

      - name: Cloudflare OpenNext build
        working-directory: v0-app
        run: npm run cf:build
