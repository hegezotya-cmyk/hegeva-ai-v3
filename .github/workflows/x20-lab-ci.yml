name: X20 Lab Stability

on:
  push:
    branches:
      - x20-lab
      - x20-wow-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: X20 runtime stability check
        run: npm run x20:stability

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
