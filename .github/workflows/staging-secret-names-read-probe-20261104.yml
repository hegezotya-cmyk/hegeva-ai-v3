name: HEGEVA Read-Only Staging Binding Names Check 2026-11-04

on:
  push:
    branches: [audit/dependency-advisories-20261104]
    paths: [".github/workflows/staging-secret-names-read-probe-20261104.yml"]

permissions:
  contents: read

jobs:
  read-only-bindings:
    if: ${{ github.repository == 'hegezotya-cmyk/hegeva-ai-v3' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - name: GET deployed API Worker settings and report only required binding presence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id = process.env.CLOUDFLARE_ACCOUNT_ID || ""
          const token = process.env.CLOUDFLARE_API_TOKEN || ""
          if (!id || !token) { console.error("Staging Cloudflare token missing"); process.exit(1) }
          const script = "hegeva-ai-v3-staging"
          const url = "https://api.cloudflare.com/client/v4/accounts/" +
            encodeURIComponent(id) + "/workers/scripts/" + script + "/settings"
          const r = await fetch(url, {method:"GET",headers:{Authorization:"Bearer " + token}})
          console.log(JSON.stringify({check:"staging-api-settings-GET",status:r.status}))
          if (r.status !== 200) { process.exit(1) }
          const data = await r.json()
          if (data.success !== true) { console.error("Cloudflare script settings not available"); process.exit(1) }
          const bindings = Array.isArray(data?.result?.bindings) ? data.result.bindings : []
          const byName = new Map(bindings.map(x=>[x.name,x]))
          let safe = true
          for (const name of ["DB","BETTER_AUTH_SECRET","RESEND_API_KEY","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET"]) {
            const b = byName.get(name)
            const exists = !!b
            const type = b && typeof b.type === "string" ? b.type : null
            console.log(JSON.stringify({name,present:exists,type}))
            if (!exists) safe = false
          }
          const mode = byName.get("PAYMENT_MODE")
          const appOrigin = byName.get("PUBLIC_APP_URL")
          const testMode = mode?.text === "test"
          const stagingOrigin = appOrigin?.text === "https://staging.hegevaai.co.uk"
          console.log(JSON.stringify({check:"payment-mode-is-test",pass:testMode}))
          console.log(JSON.stringify({check:"first-party-staging-origin",pass:stagingOrigin}))
          if (!testMode || !stagingOrigin) safe = false
          // Never output binding values, secrets, IDs, service code or response payload.
          if (!safe) { console.error("Staging authenticated E2E readiness BLOCKED on required binding check"); process.exit(1) }
          console.log("PASS Staging binding names and non-secret mode/origin checks")
          NODE
