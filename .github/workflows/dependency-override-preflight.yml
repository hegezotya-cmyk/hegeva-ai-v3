name: Dependency Override Preflight

on:
  push:
    branches:
      - codex/dependency-overrides-pr108-20261115

permissions:
  contents: read

jobs:
  dependency-overrides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Run Worker and Core regression checks
        run: npm run worker:check
      - name: Run Wrangler local dry-run
        run: npx wrangler deploy --dry-run
      - name: Install V0 dependencies
        working-directory: v0-app
        run: npm ci
      - name: Require clean dependency audits
        run: |
          npm audit --audit-level=low
          npm --prefix v0-app audit --audit-level=low
      - name: Run V0 TypeScript check
        working-directory: v0-app
        run: npx tsc --noEmit
      - name: Run V0 application build
        working-directory: v0-app
        run: npm run build
      - name: Run Cloudflare adapter build
        working-directory: v0-app
        run: npm run cf:build
