name: HEGEVA Restoration Validation
on:
  pull_request:
    branches: [v0-rebuild]
    paths:
      - "v0-app/**"
      - ".github/workflows/hegeva-restore-validation.yml"
permissions:
  contents: read
jobs:
  full-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run cf:build
