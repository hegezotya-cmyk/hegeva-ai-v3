name: HEGEVA Staging Token Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    name: Verify staging token identity only
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check account token identity and active status
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Staging Cloudflare token secret is missing."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Staging Cloudflare account ID is missing or malformed."
            exit 1
          fi

          response="$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"

          printf '%s' "$response" | jq -c '{
            success,
            result: {id: .result.id, status: .result.status, expires_on: .result.expires_on},
            errors: [.errors[]? | {code, message}]
          }'

          printf '%s' "$response" | jq -e '
            .success == true and
            (.result.id | type == "string" and test("^[a-f0-9]{32}$")) and
            .result.status == "active"
          ' >/dev/null

          expiry="$(printf '%s' "$response" | jq -r '.result.expires_on // "not returned"')"
          token_id="$(printf '%s' "$response" | jq -r '.result.id')"
          echo "PASS: staging secret authenticates as active account token ID $token_id; expiry: $expiry."
          echo "NOTE: this verifies identity and active status only; it does not prove D1 or Worker write permissions."
