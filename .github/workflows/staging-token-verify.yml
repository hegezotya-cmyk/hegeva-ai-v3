name: Verify staging Cloudflare token

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-token:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Verify account token without disclosing credentials
        env:
          CF_STAGING_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CF_STAGING_ACCOUNT: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          account = os.environ.get('CF_STAGING_ACCOUNT', '')
          token = os.environ.get('CF_STAGING_TOKEN', '')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', account) or not token:
              sys.exit('BLOCKED: missing or invalid staging credentials')
          request = urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/' + account + '/tokens/verify', headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.load(response)
              result = data.get('result') or {}
              identifier, status = result.get('id', ''), result.get('status', '')
              if data.get('success') is not True or not re.fullmatch(r'[0-9a-fA-F]{32}', identifier) or status != 'active':
                  sys.exit('BLOCKED: token status or identity not verified')
              print('Token ID:', identifier)
              print('Token status: active')
          except Exception:
              sys.exit('BLOCKED: Cloudflare token verification request failed')
          PY
