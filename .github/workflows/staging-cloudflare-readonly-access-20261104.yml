name: HEGEVA Staging Cloudflare Read-Only Access Audit 2026-11-04

on:
  push:
    branches: [audit/dependency-advisories-20261104]
    paths:
      - ".github/workflows/staging-cloudflare-readonly-access-20261104.yml"

permissions:
  contents: read

jobs:
  diagnose-staging-token:
    if: ${{ github.repository == 'hegezotya-cmyk/hegeva-ai-v3' && github.ref == 'refs/heads/audit/dependency-advisories-20261104' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - name: Verify staging API token scope through GET requests only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const id = process.env.CLOUDFLARE_ACCOUNT_ID || ""
          const token = process.env.CLOUDFLARE_API_TOKEN || ""
          if (!id || !token) { console.error("Staging Cloudflare secret not configured"); process.exit(1) }
          const checks = [
            ["account-token-verify", `/accounts/${id}/tokens/verify`],
            ["staging-api-service", `/accounts/${id}/workers/services/hegeva-ai-v3-staging`],
            ["staging-api-script", `/accounts/${id}/workers/scripts/hegeva-ai-v3-staging`],
            ["staging-api-deployments", `/accounts/${id}/workers/scripts/hegeva-ai-v3-staging/deployments`],
            ["staging-ui-service", `/accounts/${id}/workers/services/hegeva-ai-v3-v0-staging`],
            ["staging-ui-deployments", `/accounts/${id}/workers/scripts/hegeva-ai-v3-v0-staging/deployments`]
          ]
          for (const [name, path] of checks) {
            try {
              const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
                method: "GET", headers: { Authorization: "Bearer " + token }
              })
              const body = await response.json().catch(() => null)
              console.log(JSON.stringify({
                check: name,
                method: "GET",
                status: response.status,
                success: Boolean(body?.success),
                errorCodes: (body?.errors || []).map(e => Number(e.code)).filter(Number.isFinite)
              }))
            } catch (err) {
              console.log(JSON.stringify({ check: name, method: "GET", errorType: err?.name || "NetworkError" }))
            }
          }
          console.log("Diagnostic complete. No writes, secret values, Worker code, or account ids printed.")
          NODE
