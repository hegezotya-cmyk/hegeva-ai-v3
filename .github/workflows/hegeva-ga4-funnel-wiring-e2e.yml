name: HEGEVA GA4 Funnel Wiring E2E

on:
  push:
    branches:
      - growth-launch-audit-v1-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ga4-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        working-directory: v0-app
        run: npm ci

      - name: Install Chromium
        working-directory: v0-app
        run: npx playwright install --with-deps chromium

      - name: Verify consented GA4 funnel wiring without sending test traffic
        working-directory: v0-app
        shell: bash
        run: |
          cat > .hegeva-ga4-wiring.mjs <<'NODE'
          import { chromium } from "playwright"
          const BASE="https://hegevaai.co.uk"
          const failures=[]
          const ok=(n,d="")=>console.log("PASS",n,d)
          const bad=(n,d="")=>{failures.push(n+": "+d);console.error("FAIL",n,d)}

          async function context(browser){
            const c=await browser.newContext({viewport:{width:1440,height:900},permissions:["clipboard-read","clipboard-write"]})
            await c.addInitScript(()=>localStorage.setItem("hegeva:analytics-consent:v1","granted"))
            await c.route(/googletagmanager\.com|google-analytics\.com|analytics\.google\.com|clarity\.ms/, route=>route.abort())
            return c
          }

          async function gaEvents(page){
            return await page.evaluate(()=>{
              const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch{return x}})
              return rows.filter(x=>Array.isArray(x)&&x[0]==="event").map(x=>({name:x[1],params:x[2]||{}}))
            })
          }
          const names=events=>events.map(e=>e.name)
          const requireEvents=(events,expected,label)=>{
            const have=names(events)
            for(const e of expected) have.includes(e)?ok(label,e):bad(label,"missing "+e+"; have "+have.join(","))
          }

          const browser=await chromium.launch({headless:true})
          try {
            {
              const c=await context(browser), p=await c.newPage()
              await p.goto(BASE+"/challenge?utm_source=linkedin&utm_medium=organic&utm_campaign=hegeva_growth_2026&utm_content=video_1",{waitUntil:"domcontentloaded",timeout:45000})
              await p.waitForTimeout(500)
              await p.getByRole("button",{name:/START FREE DEMO/i}).click()
              await p.getByRole("button",{name:/^Electrician$/i}).click()
              await p.getByText("£2,050 currently needs attention",{exact:false}).waitFor({timeout:15000})
              await p.getByRole("button",{name:/PREPARE ACTION/i}).click()
              await p.getByText("Prepared only. Nothing has been sent.",{exact:false}).waitFor()
              await p.getByRole("button",{name:/SHARE THE CHALLENGE/i}).click()
              await p.evaluate(()=>document.addEventListener("click",e=>{const a=e.target instanceof Element?e.target.closest("a"):null;if(a&&a.getAttribute("href")?.startsWith("/login?mode=register"))e.preventDefault()},true))
              await p.getByRole("link",{name:/TRY WITH MY BUSINESS/i}).click()
              await p.waitForTimeout(200)
              const expectedChallenge=["challenge_view","challenge_start","business_type_selected","demo_loaded","demo_analysis_complete","priority_viewed","business_score_view","prepare_action_click","prepared_action_complete","challenge_complete","share_click","try_my_business_click"]
              await p.waitForFunction((expected)=>{
                const rows=(window.dataLayer||[]).map(x=>{try{return Array.from(x)}catch{return x}})
                const names=rows.filter(x=>Array.isArray(x)&&x[0]==="event").map(x=>x[1])
                return expected.every(name=>names.includes(name))
              },expectedChallenge,{timeout:5000}).catch(()=>{})
              const events=await gaEvents(p)
              requireEvents(events,expectedChallenge,"Challenge GA4 wiring")
              const tracked=events.find(e=>e.name==="challenge_start")
              const q=tracked?.params||{}
              q.campaign_source==="linkedin"&&q.campaign_medium==="organic"&&q.campaign_name==="hegeva_growth_2026"&&q.campaign_content==="video_1" ? ok("UTM propagation","linkedin/organic/hegeva_growth_2026/video_1") : bad("UTM propagation",JSON.stringify(q))
              await c.close()
            }

            {
              const c=await context(browser), p=await c.newPage()
              await p.goto(BASE+"/free-tools",{waitUntil:"domcontentloaded",timeout:45000})
              await p.getByRole("button",{name:/Admin Cost Calculator/i}).click()
              await p.getByRole("button",{name:/Invoice Chaser/i}).click()
              await p.getByLabel("Customer name").fill("GA4 Test")
              await p.getByRole("button",{name:/^GENERATE$/i}).click()
              await p.evaluate(()=>document.addEventListener("click",e=>{const a=e.target instanceof Element?e.target.closest("a"):null;if(a&&a.getAttribute("href")==="/challenge")e.preventDefault()},true))
              await p.getByRole("link",{name:/60-SECOND CHALLENGE/i}).click()
              await p.waitForTimeout(200)
              const events=await gaEvents(p)
              requireEvents(events,["free_tool_use","free_tool_cta_click"],"Free Tools GA4 wiring")
              await c.close()
            }

            {
              const c=await context(browser), p=await c.newPage()
              await p.goto(BASE+"/r/ga4wire",{waitUntil:"domcontentloaded",timeout:45000})
              await p.waitForTimeout(700)
              const events=await gaEvents(p)
              requireEvents(events,["referral_visit"],"Referral GA4 wiring")
              const ref=events.find(e=>e.name==="referral_visit")
              ref?.params?.referral_code==="ga4wire" ? ok("Referral code propagation","ga4wire") : bad("Referral code propagation",JSON.stringify(ref?.params||{}))
              await c.close()
            }

            {
              const c=await context(browser), p=await c.newPage()
              await p.goto(BASE+"/login?mode=register&callbackURL=%2Fget-started",{waitUntil:"domcontentloaded",timeout:45000})
              await p.locator('[data-registration-active="true"]').waitFor({timeout:10000})
              await p.waitForTimeout(300)
              const events=await gaEvents(p)
              requireEvents(events,["registration_start"],"Registration GA4 wiring")
              await c.close()
            }

            console.log("AUTH-GATED RUNTIME NOT RUN: own_business_start, own_business_result, referral_signup require a real authenticated/registration completion flow; source audits cover their wiring.")
          } finally { await browser.close() }

          if(failures.length){for(const f of failures)console.error("-",f);process.exit(1)}
          console.log("HEGEVA GA4 Funnel Wiring E2E PASS")
          NODE
          node ./.hegeva-ga4-wiring.mjs
          rm -f .hegeva-ga4-wiring.mjs