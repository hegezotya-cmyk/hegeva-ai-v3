name: HEGEVA Safe Dependency Lock Refresh Candidate

on:
  push:
    branches:
      - audit/dependency-advisories-20261104
    paths:
      - '.github/workflows/dependency-lock-refresh-candidate.yml'
      - 'v0-app/wrangler.jsonc'
      - 'v0-app/wrangler.staging.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json
      - name: Resolve compatible lockfile upgrades (no scripts, no deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm update --package-lock-only --ignore-scripts --no-fund --no-audit
          npm --prefix v0-app update --package-lock-only --ignore-scripts --no-fund --no-audit
          # Reconcile generated lockfiles with the dependency graph before npm ci validation.
          npm install --ignore-scripts --no-fund --no-audit
          npm --prefix v0-app install --ignore-scripts --no-fund --no-audit
      - name: Retain lockfiles for review even if subsequent tests fail
        uses: actions/upload-artifact@v4
        with:
          name: hegeva-candidate-lockfiles
          retention-days: 7
          path: |
            package-lock.json
            v0-app/package-lock.json
      - name: Install exact candidate dependencies
        run: |
          npm ci
          npm --prefix v0-app ci
      - name: Inventory residual advisories
        run: node scripts/dependency-security-report.mjs
      - name: Block critical and high production advisories
        run: |
          npm audit --package-lock-only --omit=dev --audit-level=high
          npm --prefix v0-app audit --package-lock-only --omit=dev --audit-level=high
      - name: Worker and authentication checks
        run: npm run worker:check
      - name: Staging isolation checks
        run: node scripts/staging-isolation-audit.mjs
      - name: Billing and registration regression checks
        run: |
          npm --prefix v0-app run audit:billing
          npm --prefix v0-app run audit:registration-measurement
      - name: TypeScript check
        run: cd v0-app && npx tsc --noEmit
      - name: Next.js build
        run: npm --prefix v0-app run build
      - name: Cloudflare build (offline only)
        run: npm --prefix v0-app run cf:build

  commit-tested-lockfiles:
    needs: refresh-and-verify
    if: ${{ github.repository == 'hegezotya-cmyk/hegeva-ai-v3' && github.ref == 'refs/heads/audit/dependency-advisories-20261104' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact security branch only
        uses: actions/checkout@v4
      - name: Retrieve validated lockfile candidates from same workflow
        uses: actions/download-artifact@v4
        with:
          name: hegeva-candidate-lockfiles
          path: .
      - name: Commit only the tested lockfiles to the isolated security branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "audit/dependency-advisories-20261104"
          git add -- package-lock.json v0-app/package-lock.json
          if git diff --cached --quiet; then
            echo "Already up to date; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: record lockfiles after isolated CI and production advisory gate"
          git push origin HEAD:refs/heads/audit/dependency-advisories-20261104
