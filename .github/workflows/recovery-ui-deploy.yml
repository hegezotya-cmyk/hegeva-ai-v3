name: HEGEVA Recovery UI Deploy

on:
  pull_request:
    branches:
      - owner-approved-email-delivery-v1-20260915
    paths:
      - "v0-app/**"
      - ".github/workflows/recovery-ui-deploy.yml"

permissions:
  contents: read

concurrency:
  group: hegeva-recovery-ui-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify-and-deploy-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Consent Mode V2 audit
        run: node scripts/consent-mode-v2-audit.mjs

      - name: Demo analytics audit
        run: node scripts/demo-analytics-audit.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy V0 UI Worker only
        run: npm run cf:deploy
