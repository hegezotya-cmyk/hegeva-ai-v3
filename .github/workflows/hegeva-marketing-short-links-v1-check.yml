name: HEGEVA Marketing Short Links V1 Check

on:
  push:
    branches:
      - growth-short-links-v1-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce narrow short-link scope
        shell: bash
        run: |
          BASE=f8b0b852404493922c8a8f8e0c799f47a2fb6398
          allowed='^(\.github/workflows/hegeva-marketing-short-links-v1-ui-deploy\.yml|.github/workflows/hegeva-marketing-short-links-v1-check.yml|v0-app/app/(li|fb|ig|tt|reddit|yt|sc)/page.tsx|v0-app/scripts/marketing-short-links-audit.mjs)$'
          bad=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - name: Verify protected HEGEVA files unchanged
        shell: bash
        run: |
          git diff --exit-code f8b0b852404493922c8a8f8e0c799f47a2fb6398 --             v0-app/components/hegeva-logo.tsx             v0-app/app/globals.css             v0-app/components/desktop-command-rail.tsx             v0-app/components/site-header.tsx             v0-app/components/app-shell.tsx             v0-app/components/command-center/core-decision-surface.tsx             v0-app/lib/hegeva-core.ts             v0-app/components/auth/auth-panel.tsx             v0-app/components/growth/sixty-second-challenge.tsx             v0-app/app/get-started/page.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        working-directory: v0-app
        run: npm ci

      - name: Marketing short-links audit
        working-directory: v0-app
        run: node scripts/marketing-short-links-audit.mjs

      - name: TypeScript check
        working-directory: v0-app
        run: npx tsc --noEmit

      - name: Production build
        working-directory: v0-app
        run: npm run build
