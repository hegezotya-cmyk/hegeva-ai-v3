name: X20 Edit Capability Check

on:
  pull_request:
    branches:
      - v0-rebuild
    paths:
      - 'v0-app/**'
      - 'scripts/staging-ui-*.mjs'
      - '.github/workflows/x20-edit-capability-check.yml'

permissions:
  contents: read

jobs:
  verify-edit-capability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: X20 capability audit
        run: npm run x20:capability

      - name: X20 full audit
        run: npm run x20:audit

      - name: Analytics campaign and registration regression
        run: npm run audit:acquisition && npm run audit:registration-measurement

      - name: Stripe billing and payment journey safety audits
        run: npm run audit:billing && npm run audit:money-journey

      - name: Staging UI deployment permission probe safety test (offline)
        run: node ../scripts/staging-ui-deployment-read-probe-test.mjs && node ../scripts/staging-ui-version-assessment-test.mjs && node ../scripts/staging-ui-activation-proposal-test.mjs && node ../scripts/staging-ui-live-proposal-test.mjs && node ../scripts/staging-ui-check-policy-test.mjs && node ../scripts/staging-ui-current-state-probe-test.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Build isolated staging analytics browser fixture
        env:
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TESTONLY
        run: npm run build

      - name: Install isolated browser for registration regression
        run: npx playwright install --with-deps chromium

      - name: Browser registration measurement with stubbed API
        shell: bash
        env:
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TESTONLY
          TEST_BASE_URL: http://127.0.0.1:3010
        run: |
          set -euo pipefail
          PORT=3010 npm run start -- --hostname 127.0.0.1 > /tmp/hegeva-registration-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3010/login?mode=register > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -80 /tmp/hegeva-registration-test-server.log
            exit 1
          fi
          npm run test:registration-measurement-browser

      - name: Build Cloudflare OpenNext staging bundle (offline, no deploy)
        env:
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TESTONLY
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ""
        run: npm run cf:build

      - name: Record offline build provenance (no upload)
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s .open-next/worker.js
          bundle_sha="$(sha256sum .open-next/worker.js | cut -d ' ' -f 1)"
          {
            echo '### HEGEVA Cloudflare offline build provenance'
            echo "- Pull request source commit: \`$PR_HEAD_SHA\`"
            echo "- GitHub CI checkout commit: \`$(git rev-parse HEAD)\`"
            echo "- Worker bundle SHA-256: \`$bundle_sha\`"
            echo "- Worker uploaded: **no**"
            echo "- Worker activated: **no**"
          } >> "$GITHUB_STEP_SUMMARY"
