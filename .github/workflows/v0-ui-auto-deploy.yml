name: HEGEVA V0 UI Auto Deploy

on:
  push:
    branches:
      - v0-rebuild
    paths:
      - "v0-app/**"
      - ".github/workflows/v0-ui-auto-deploy.yml"

permissions:
  contents: read

concurrency:
  group: hegeva-v0-ui-auto-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: X20 runtime stability check
        run: npm run x20:stability

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Cloudflare OpenNext build
        run: npm run cf:build

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy V0 UI Worker
        run: npm run cf:deploy

      - name: Smoke test production domains
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local url="$1"
            local body
            echo "Checking $url"
            body="$(curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 "$url")"
            echo "$body" | grep -qi "HEGEVA" || {
              echo "Expected HEGEVA marker was not found at $url"
              exit 1
            }
          }

          check_page "https://hegevaai.co.uk/"
          check_page "https://hegevaai.co.uk/command-center"
          check_page "https://hegevaai.co.uk/assistant"
          check_page "https://hegevaai.co.uk/app-studio"
          check_page "https://hegevaai.co.uk/business"
          check_page "https://hegevaai.co.uk/pricing"
          check_page "https://hegevaai.co.uk/login"
          check_page "https://www.hegevaai.co.uk/"

          not_found_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output "$not_found_file" --write-out '%{http_code}' \
            "https://hegevaai.co.uk/hegeva-live-smoke-test-missing-page")"
          test "$status" = "404" || {
            echo "Expected production 404, got HTTP $status"
            exit 1
          }
          grep -qi "HEGEVA" "$not_found_file" || {
            echo "Custom HEGEVA 404 marker was not found"
            exit 1
          }

          echo "Production smoke test passed for HEGEVA custom domains and core routes."
