name: HEGEVA Staging Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Staging operation"
        required: true
        default: "check"
        type: choice
        options: [check, asset-probe, metadata-probe, deploy-api, deploy-api-no-migrate, deploy-ui, smoke, full]

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_ENV: staging
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.STAGING_GA_MEASUREMENT_ID }}
  NEXT_PUBLIC_GA_DEBUG_MODE: enabled
  NEXT_PUBLIC_CLARITY_PROJECT_ID: ""

concurrency:
  group: hegeva-staging-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.stage != 'asset-probe' && inputs.stage != 'metadata-probe' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json
      - run: npm ci
      - run: npm --prefix v0-app ci
      - run: node scripts/staging-isolation-audit.mjs
      - run: node scripts/staging-no-migrate-gate-test.mjs
      - run: node scripts/staging-topup-config-test.mjs
      - run: node scripts/staging-smoke-gate-test.mjs
      - run: node v0-app/scripts/client-portal-log-protection-test.mjs
      - run: node v0-app/scripts/client-portal-service-binding-test.mjs
      - run: node scripts/client-portal-revocation-test.mjs
      - run: npm run worker:check
      - name: Assistant Responses and credit settlement regressions
        run: |
          node --test v0-app/scripts/assistant-responses-api-test.mjs
          node v0-app/scripts/assistant-economics-v1-audit.mjs
          node v0-app/scripts/assistant-dual-model-cost-boundary-audit.mjs
      - run: node scripts/staging-auth-origin-test.cjs
        working-directory: v0-app
      - run: npx tsc --noEmit
        working-directory: v0-app
      - run: npm run build
        working-directory: v0-app
      - run: npm run cf:build
        working-directory: v0-app

  preflight:
    if: ${{ inputs.stage != 'asset-probe' && inputs.stage != 'metadata-probe' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run staging:preflight

  deploy:
    needs: [verify, preflight]
    if: ${{ inputs.stage != 'check' && inputs.stage != 'asset-probe' && inputs.stage != 'metadata-probe' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v0-app/package-lock.json
      - run: npm ci
      - run: npm --prefix v0-app ci
      - run: npm run staging:db:migrate
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'full' }}
      - run: npm run staging:api:deploy
        if: ${{ inputs.stage == 'deploy-api' || inputs.stage == 'deploy-api-no-migrate' || inputs.stage == 'full' }}
      - run: npm run staging:ui:deploy
        if: ${{ inputs.stage == 'deploy-ui' || inputs.stage == 'full' }}
      - name: Smoke-test staging only
        # An upload is not proof that the deployed UI/API serves the expected routes.
        # Reuse the guarded smoke suite after every staging deployment operation.
        if: ${{ inputs.stage == 'smoke' || inputs.stage == 'full' || inputs.stage == 'deploy-ui' || inputs.stage == 'deploy-api' || inputs.stage == 'deploy-api-no-migrate' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGING_APP_URL" in
            https://staging.hegevaai.co.uk|https://hegeva-ai-v3-v0-staging.hegezotya.workers.dev) ;;
            *) echo "Refusing smoke test against an unapproved/non-staging URL"; exit 1 ;;
          esac
          HEGEVA_BASE_URL="$STAGING_APP_URL" npm run release:smoke

  asset-probe:
    if: ${{ inputs.stage == 'asset-probe' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate probe safeguards
        run: node scripts/staging-asset-probe-test.mjs
      - name: Check staging upload session permission
        shell: bash
        run: |
          node --input-type=module -e 'import { probe } from "./scripts/staging-asset-probe.mjs"; const result = await probe(process.env.CLOUDFLARE_ACCOUNT_ID || "", process.env.CLOUDFLARE_API_TOKEN || ""); console.log(JSON.stringify(result)); if (result.result !== "SESSION_CREATED") process.exitCode = 1;'

  metadata-probe:
    if: ${{ inputs.stage == 'metadata-probe' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/staging-metadata-probe-test.mjs
      - name: Read staging metadata status only
        run: node --input-type=module -e 'import { probe } from "./scripts/staging-metadata-probe.mjs"; const result = await probe(process.env.CLOUDFLARE_ACCOUNT_ID || "", process.env.CLOUDFLARE_API_TOKEN || ""); console.log(JSON.stringify(result)); if (result.some(x => x.status !== 200)) process.exitCode = 1;'
