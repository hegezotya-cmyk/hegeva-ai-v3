name: X20 Studio WOW CI

on:
  push:
    branches:
      - x20-studio-wow
      - x20-growth-wow-2
      - x20-growth-ux-wow-3
      - x20-hardcore-wow-4
      - x20-hardcore-wow-5
      - x20-hardcore-wow-6
      - x20-functional-audit-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v0-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: X20 full functional audit
        run: npm run x20:audit

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
